name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows support is experimental and untested by the maintainers: .cmd
    # shims, process-group handling and path rules differ there. The Windows
    # jobs run so that regressions are visible, but they do not fail the build.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # The suite needs no LaTeX, no agent CLI, no API key and no network:
      # it uses a fake agent, a fake LaTeX command and local mock API servers.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
        env:
          PAPER_PAL_ENV_FILE: none

      # Surface the failing tests as annotations, so a failure can be read
      # from the run summary without opening the raw log.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: node scripts/ci-failures.mjs test.log
