name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include unpublished manuscript text, API keys, `.env` contents or files from `.paper-pal/`.**
        Issues are public and permanent. Reduce a parser problem to a few lines of made-up LaTeX.
        Security problems go to the [private report form](https://github.com/claire1217/paper-pal/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. Include the exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem. For parser bugs, a minimal made-up `.tex` snippet.
      placeholder: |
        1. npm run demo
        2. Select the first sentence of the abstract and comment "shorter"
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run --silent doctor -- --json`
      description: It contains versions and paths and never contains key values. Replace your user name in paths if you prefer.
      render: json
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: AI backend in use
      options:
        - codex (CLI)
        - claude (CLI)
        - openai
        - anthropic
        - openrouter
        - deepseek
        - ollama
        - custom (OpenAI-compatible endpoint)
        - none / not relevant
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Ubuntu 24.04, Windows 11 + WSL2, ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paper Pal version or commit
      description: Output of `git rev-parse --short HEAD` in the app folder, or the version from the start banner.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      description: Only the relevant lines. Check them for manuscript text before pasting.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no unpublished manuscript text, no API keys and nothing from `.paper-pal/` or `.env`.
          required: true
