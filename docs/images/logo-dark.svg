<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Paper Pal">
  <title>Paper Pal</title>
  <!-- The Paper Pal mark: two nested letters P, each a single round-capped
       stroke, on a transparent ground. logo.svg is for light backgrounds and
       logo-dark.svg for dark ones; the favicon and the top-bar mark
       (public/index.html) use the same two paths on a 32-unit grid. -->
