<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Paper Pal">
  <title>Paper Pal</title>
  <!-- The Paper Pal mark: two nested letters P drawn as single round-capped
       strokes, white on the app's green tile so it reads on light and dark
       backgrounds. The favicon and the top-bar mark (public/index.html) use the
       same two paths on a 32-unit grid, drawn slightly larger. -->
  <rect width="128" height="128" rx="29" fill="#2d6653"/>
  <g transform="translate(-22.6 -22.9) scale(0.138)" fill="none" stroke="#fff" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <path d="M386 885V575A194 200 0 0 1 580 375H685A185 185 0 0 1 685 745H638"/>
    <path d="M516 885V577A77 77 0 0 1 593 500H680A58.5 58.5 0 0 1 680 617H632"/>
  </g>
</svg>
