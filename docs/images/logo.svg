<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Paper Pal">
  <title>Paper Pal</title>
  <!-- The Paper Pal mark: a pencil and a check mark. Same drawing as the favicon
       (public/index.html), scaled from its 32-unit grid. Its own green tile
       keeps it legible on light and dark backgrounds. -->
  <g transform="scale(4)">
    <rect width="32" height="32" rx="8" fill="#2d6653"/>
    <path d="M19.6 7.4l5 5L13 24l-6 1 1-6z" fill="#fff"/>
    <path d="M17.2 9.8l5 5" stroke="#2d6653" stroke-width="1.6"/>
    <path d="M17 24.2l2.6 2.4 5.4-5.8" fill="none" stroke="#a8d5c2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
